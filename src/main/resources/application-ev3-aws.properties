# New PostgreSQL schema only; not a migration of the live EV2 in-memory database.
server.port=8080
spring.datasource.url=${PEDIDOS_DB_URL}
spring.datasource.username=${PEDIDOS_DB_USER}
spring.datasource.password=${PEDIDOS_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never
spring.h2.console.enabled=false
spring.flyway.enabled=true
checkout.service-key=${INTERNAL_SERVICE_KEY}
logging.level.org.springframework.security=WARN
