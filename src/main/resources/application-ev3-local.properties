server.port=8080
spring.datasource.url=${PEDIDOS_DB_URL}
spring.datasource.username=${PEDIDOS_DB_USER}
spring.datasource.password=${PEDIDOS_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.defer-datasource-initialization=false
spring.sql.init.mode=never
spring.h2.console.enabled=false
spring.flyway.enabled=true
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${LOCAL_JWT_JWK_SET_URI:}
checkout.service-key=${INTERNAL_SERVICE_KEY}
