spring.application.name=fazbear-pedidos
server.port=8082

# =============================================
# BASE DE DATOS H2 (Desarrollo Local / Postman)
# =============================================
spring.datasource.url=jdbc:h2:mem:pedidosdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# =============================================
# SEGURIDAD: DESACTIVADA PARA PRUEBAS LOCALES
# =============================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://login.microsoftonline.com/e5372bf0-c5e3-4286-887c-79069f209c1f/v2.0
# Audiencia esperada en el token de acceso (Application/Client ID de Azure)
spring.security.oauth2.resourceserver.jwt.audiences=4ff2634d-561c-45aa-b1f8-27f41e8f6237

# =============================================
# CORS
# =============================================
app.cors.allowed-origins=http://localhost:4200
